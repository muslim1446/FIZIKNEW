      name="description"
      content="Aplikasi pembelajaran sains kognitif tanpa kehilangan fakta untuk Fizik KSSM Tingkatan 4 (Bab 1–6) dan Tingkatan 5 (Bab 1–7) dengan pendedahan berperingkat, kata kunci SPM verbatim, gambar rajah interaktif, dan penjejakan penguasaan skala Likert."
    />
    <meta property="og:title" content="Fizik KSSM Tingkatan 4 &amp; 5 — Nota Kognitif &amp; Semakan Aktif SPM" />

      property="og:description"
      content="Aplikasi pembelajaran sains kognitif tanpa kehilangan fakta untuk Fizik KSSM Tingkatan 4 (Bab 1–6) dan Tingkatan 5 (Bab 1–7) dengan pendedahan berperingkat, kata kunci SPM verbatim, gambar rajah interaktif, dan penjejakan penguasaan skala Likert."

      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('fizik_kssm_t4_theme_v1');
          var isDark =
            saved === 'dark' ||
            (saved !== 'light' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased selection:bg-sky-600/15 selection:text-slate-900 dark:selection:bg-sky-400/25 dark:selection:text-slate-50 transition-colors duration-200">

  </body>
